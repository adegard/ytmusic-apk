<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>YT Music</title>
  <meta name="description" content="Search and stream songs from YouTube, on-device.">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>YT Music <span id="version" class="version"></span></h1>
    <button id="fav-open" class="icon-button" aria-label="Favorites">
      <svg viewBox="0 0 24 24" width="24" height="24">
        <path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    </button>
    <button id="debug-open" class="icon-button" aria-label="Debug log" title="Debug log">?</button>
  </header>

  <form id="search-form">
    <input id="search-input" type="search" placeholder="Search songs" autocomplete="off" autofocus>
    <button type="submit" id="search-button">Search</button>
  </form>

  <div id="status" class="status" hidden></div>

  <main id="results"></main>

  <a id="buy-me-a-coffee" href="https://www.buymeacoffee.com/adegard" target="_blank" rel="noopener" aria-label="Buy me a coffee">
    <img src="https://cdn.buymeacoffee.com/buttons/v2/default-red.png" alt="Buy me a coffee">
  </a>

  <footer id="player" class="player" hidden>
    <div class="player-info">
      <div class="player-title-row">
        <div id="player-title" class="player-title"></div>
        <button id="fav-toggle" class="fav-heart" aria-label="Save to favorites">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path id="heart-outline" fill="none" stroke="currentColor" stroke-width="2" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            <path id="heart-filled" fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" style="display:none"/>
          </svg>
        </button>
      </div>
      <div id="player-sub" class="player-sub"></div>
      <div id="player-next" class="player-next"></div>
    </div>
    <button id="toggle" class="toggle" aria-label="Play/Pause">
      <svg viewBox="0 0 24 24" width="34" height="34" id="toggle-icon">
        <path id="icon-pause" fill="currentColor" d="M6 4h4v16H6zM14 4h4v16h-4z"/>
        <path id="icon-play" fill="currentColor" d="M8 5v14l11-7z" style="display:none"/>
      </svg>
    </button>
  </footer>

  <div id="fav-modal" class="modal" hidden>
    <div class="modal-backdrop" id="fav-backdrop"></div>
    <div class="modal-panel">
      <div class="modal-head">
        <h2>Favorites</h2>
        <button id="fav-close" class="icon-button" aria-label="Close">✕</button>
      </div>
      <div id="fav-list" class="fav-list"></div>
    </div>
  </div>

  <div id="debug" class="debug" hidden>
    <pre id="debug-log"></pre>
  </div>

  <div id="embed-wrap" class="embed-wrap">
    <div id="yt-embed"></div>
  </div>

  <script src="yt.js"></script>
  <script src="app.js"></script>
</body>
</html>
